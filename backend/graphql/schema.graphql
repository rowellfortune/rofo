# AppSync schema. Every resolver returns { success, data, error }.
# Default auth: Cognito user pool. Public fields also allow IAM (guest via identity pool).

enum Deal { buy rent }
enum PropertyType { House Apartment Villa Land Commercial }
enum SortBy { newest price_asc price_desc area_desc }

type Listing @aws_iam @aws_cognito_user_pools {
  id: ID!
  deal: Deal!
  type: PropertyType!
  title: String!
  address: String!
  city: String!
  country: String!
  price: Float!
  beds: Int!
  baths: Int!
  areaM2: Int!
  plotM2: Int
  yearBuilt: Int
  isNew: Boolean!
  openHouse: String
  description: String!
  features: [String!]!
  images: [String!]!
  lat: Float
  lng: Float
  agentId: ID!
  agentName: String!
  agency: String!
  phone: String!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type ListingPage @aws_iam @aws_cognito_user_pools {
  items: [Listing!]!
  nextToken: String
}

type Inquiry {
  id: ID!
  listingId: ID!
  userId: ID!
  name: String!
  email: AWSEmail!
  message: String!
  createdAt: AWSDateTime!
}

type ListingResult @aws_iam @aws_cognito_user_pools { success: Boolean! data: Listing error: String }
type ListingPageResult @aws_iam @aws_cognito_user_pools { success: Boolean! data: ListingPage error: String }
type ListingsResult { success: Boolean! data: [Listing!] error: String }
type InquiriesResult { success: Boolean! data: [Inquiry!] error: String }
type InquiryResult { success: Boolean! data: Inquiry error: String }
type BooleanResult { success: Boolean! data: Boolean error: String }

input SearchListingsInput {
  deal: Deal!
  country: String
  city: String
  type: PropertyType
  minPrice: Float
  maxPrice: Float
  minBeds: Int
  sortBy: SortBy
  limit: Int
  nextToken: String
}

input ListingInput {
  deal: Deal!
  type: PropertyType!
  title: String!
  address: String!
  city: String!
  country: String!
  price: Float!
  beds: Int!
  baths: Int!
  areaM2: Int!
  plotM2: Int
  yearBuilt: Int
  isNew: Boolean
  openHouse: String
  description: String!
  features: [String!]
  images: [String!]
  lat: Float
  lng: Float
  agency: String!
  phone: String!
}

input InquiryInput {
  listingId: ID!
  name: String!
  email: AWSEmail!
  message: String!
}

enum PoolStatus { FORMING SAVING READY CLOSED }

type PoolMember {
  userId: ID!
  name: String!
  monthly: Float!
  contributed: Float!
  sharePct: Float!
  joinedAt: AWSDateTime!
}

type PoolLedgerEntry {
  id: ID!
  userId: ID!
  amount: Float!
  note: String!
  createdAt: AWSDateTime!
}

type PoolProposal {
  id: ID!
  title: String!
  detail: String!
  createdBy: ID!
  createdAt: AWSDateTime!
  yes: Int!
  no: Int!
  needed: Int!
  status: String!
  myVote: String
}

# Members, ledger and proposals are only filled for members of the pool.
type Pool {
  id: ID!
  name: String!
  listingId: ID!
  listingPrice: Float!
  goal: Float!
  raised: Float!
  maxMembers: Int!
  memberCount: Int!
  targetMonths: Int!
  status: PoolStatus!
  creatorId: ID!
  createdAt: AWSDateTime!
  viewerIsMember: Boolean
  members: [PoolMember!]!
  ledger: [PoolLedgerEntry!]!
  proposals: [PoolProposal!]!
}

type PoolPage { items: [Pool!]! nextToken: String }

type PoolResult { success: Boolean! data: Pool error: String }
type PoolPageResult { success: Boolean! data: PoolPage error: String }
type PoolsResult { success: Boolean! data: [Pool!] error: String }

input CreatePoolInput {
  name: String!
  listingId: ID!
  maxMembers: Int!
  targetMonths: Int!
  monthly: Float!
}

input PoolProposalInput {
  title: String!
  detail: String
}

type GeoCandidate { label: String! lat: Float! lng: Float! city: String country: String }
type GeocodeResult { success: Boolean! data: [GeoCandidate!] error: String }

enum ApplicationStatus { PENDING APPROVED REJECTED }
enum ApplicationDecision { APPROVED REJECTED }

type AgentApplication {
  userId: ID!
  email: String!
  name: String!
  agency: String!
  phone: String!
  registrationNo: String!
  country: String!
  website: String
  about: String!
  status: ApplicationStatus!
  reviewNote: String
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  reviewedAt: AWSDateTime
}

type ApplicationResult { success: Boolean! data: AgentApplication error: String }
type ApplicationsResult { success: Boolean! data: [AgentApplication!] error: String }

input AgentApplicationInput {
  name: String!
  agency: String!
  phone: String!
  registrationNo: String!
  country: String!
  website: String
  about: String!
}

type Query {
  getListing(id: ID!): ListingResult @aws_iam @aws_cognito_user_pools
  searchListings(input: SearchListingsInput!): ListingPageResult @aws_iam @aws_cognito_user_pools
  myListings: ListingsResult @aws_cognito_user_pools(cognito_groups: ["Agent", "Admin"])
  myFavorites: ListingsResult @aws_cognito_user_pools
  listingInquiries(listingId: ID!): InquiriesResult @aws_cognito_user_pools(cognito_groups: ["Agent", "Admin"])
  myAgentApplication: ApplicationResult @aws_cognito_user_pools
  agentApplications(status: ApplicationStatus!): ApplicationsResult @aws_cognito_user_pools(cognito_groups: ["Admin"])
  geocodeAddress(query: String!): GeocodeResult @aws_cognito_user_pools(cognito_groups: ["Agent", "Admin"])
  listPools(listingId: ID, limit: Int, nextToken: String): PoolPageResult @aws_cognito_user_pools
  getPool(id: ID!): PoolResult @aws_cognito_user_pools
  myPools: PoolsResult @aws_cognito_user_pools
}

type Mutation {
  createListing(input: ListingInput!): ListingResult @aws_cognito_user_pools(cognito_groups: ["Agent", "Admin"])
  updateListing(id: ID!, input: ListingInput!): ListingResult @aws_cognito_user_pools(cognito_groups: ["Agent", "Admin"])
  deleteListing(id: ID!): BooleanResult @aws_cognito_user_pools(cognito_groups: ["Agent", "Admin"])
  toggleFavorite(listingId: ID!): BooleanResult @aws_cognito_user_pools
  sendInquiry(input: InquiryInput!): InquiryResult @aws_cognito_user_pools
  submitAgentApplication(input: AgentApplicationInput!): ApplicationResult @aws_cognito_user_pools
  reviewAgentApplication(userId: ID!, decision: ApplicationDecision!, note: String): ApplicationResult @aws_cognito_user_pools(cognito_groups: ["Admin"])
  createPool(input: CreatePoolInput!): PoolResult @aws_cognito_user_pools
  joinPool(poolId: ID!, monthly: Float!): BooleanResult @aws_cognito_user_pools
  leavePool(poolId: ID!): BooleanResult @aws_cognito_user_pools
  createPoolProposal(poolId: ID!, input: PoolProposalInput!): BooleanResult @aws_cognito_user_pools
  votePoolProposal(poolId: ID!, proposalId: ID!, choice: String!): BooleanResult @aws_cognito_user_pools
  recordPoolContribution(poolId: ID!, userId: ID!, amount: Float!, note: String): BooleanResult @aws_cognito_user_pools(cognito_groups: ["Admin"])
}

schema { query: Query mutation: Mutation }
